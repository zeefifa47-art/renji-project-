name: Build Renji APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode keystore
        run: echo "${{ secrets.RENJI_KEYSTORE_B64 }}" | base64 -d > app/renji.keystore

      - name: Build release APK
        env:
          RENJI_KEYSTORE: renji.keystore
          RENJI_KEYSTORE_PASS: ${{ secrets.RENJI_KEYSTORE_PASS }}
          RENJI_KEY_ALIAS: ${{ secrets.RENJI_KEY_ALIAS }}
          RENJI_KEY_PASS: ${{ secrets.RENJI_KEY_PASS }}
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: renji-release
          path: app/build/outputs/apk/release/*.apk
